<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>24h Stories Feature</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <main class="app">

        <!-- STORIES BAR -->
        <div class="stories-bar" id="storiesBar">

            <!-- ADD STORY -->
            <div class="story add" id="addStory">
                <span>+</span>
            </div>

        </div>

        <!-- STORY VIEWER -->
        <div class="viewer hidden" id="viewer">

            <div class="progress"></div>

            <img id="storyImage" />

        </div>

        <!-- FILE INPUT -->
        <input type="file" id="fileInput" accept="image/*" hidden>

    </main>

    <script src="script.js"></script>

</body>

</html>
