<!DOCTYPE html>
<html lang="en">

<head>

    <!-- =========================
         META
    ========================== -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Datepicker UI</title>

    <meta name="description" content="Modern static datepicker UI built with HTML and CSS">

    <!-- =========================
         FONTS
    ========================== -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- =========================
         STYLE
    ========================== -->
    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- =========================
         MAIN WRAPPER
    ========================== -->

    <main class="wrapper">

        <!-- DATE PICKER CARD -->
        <section class="datepicker">

            <!-- HEADER -->
            <div class="header">

                <h1>Select Date</h1>

                <p>Choose a date for your booking</p>

            </div>

            <!-- MONTH NAVIGATION -->
            <div class="month">

                <button>&larr;</button>

                <h2>June 2026</h2>

                <button>&rarr;</button>

            </div>

            <!-- WEEK DAYS -->
            <div class="weekdays">

                <span>Mon</span>
                <span>Tue</span>
                <span>Wed</span>
                <span>Thu</span>
                <span>Fri</span>
                <span>Sat</span>
                <span>Sun</span>

            </div>

            <!-- DAYS GRID -->
            <div class="days">

                <!-- previous month -->
                <span class="disabled">27</span>
                <span class="disabled">28</span>
                <span class="disabled">29</span>
                <span class="disabled">30</span>
                <span class="disabled">31</span>

                <!-- current month -->
                <span>1</span>
                <span>2</span>
                <span>3</span>
                <span>4</span>
                <span>5</span>
                <span>6</span>
                <span>7</span>
                <span>8</span>
                <span>9</span>
                <span>10</span>
                <span class="active">11</span>
                <span>12</span>
                <span>13</span>
                <span>14</span>
                <span>15</span>
                <span>16</span>
                <span>17</span>
                <span>18</span>
                <span>19</span>
                <span>20</span>
                <span>21</span>
                <span>22</span>
                <span>23</span>
                <span>24</span>
                <span>25</span>
                <span>26</span>
                <span>27</span>
                <span>28</span>
                <span>29</span>
                <span>30</span>

            </div>

            <!-- FOOTER ACTION -->
            <div class="footer">

                <button class="cancel">Cancel</button>

                <button class="apply">Apply</button>

            </div>

        </section>

    </main>

</body>

</html>
