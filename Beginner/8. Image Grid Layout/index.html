<!DOCTYPE html>
<html lang="en">

<head>

    <!-- META -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Image Grid Layout</title>

    <meta name="description" content="Responsive image grid layout built with CSS Grid">

    <!-- FONT -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- MAIN WRAPPER -->

    <main class="container">

        <!-- HEADER -->

        <header class="header">

            <h1>Image Grid</h1>

            <p>CSS Grid layout practice with responsive design</p>

        </header>

        <!-- GRID -->

        <section class="grid">

            <figure class="item item-1">
                <img src="images/img1.jpg" alt="Foggy beach with rock formation">
            </figure>

            <figure class="item item-2">
                <img src="images/img2.jpg" alt="Modern living room interior">
            </figure>

            <figure class="item item-3">
                <img src="images/img3.jpg" alt="Food table setup">
            </figure>

            <figure class="item item-4">
                <img src="images/img4.jpg" alt="Building with red door and tree">
            </figure>

            <figure class="item item-5">
                <img src="images/img5.jpg" alt="Apartment buildings street view">
            </figure>

            <figure class="item item-6">
                <img src="images/img6.jpg" alt="Beach view from hill">
            </figure>

        </section>

    </main>

</body>

</html>
