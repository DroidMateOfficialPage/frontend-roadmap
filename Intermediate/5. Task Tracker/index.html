<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Task Tracker</title>

    <meta name="description" content="Modern task tracker with JavaScript state management">

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <main class="app">

        <header class="header">
            <h1>Task Tracker</h1>
            <p>Stay organized. Execute faster.</p>
        </header>

        <!-- INPUT -->
        <section class="input-box">

            <input id="taskInput" placeholder="Add a new task..." />
            <button id="addBtn">Add</button>

        </section>

        <!-- LIST -->
        <section>

            <ul id="taskList"></ul>

        </section>

    </main>

    <script src="script.js"></script>

</body>

</html>
