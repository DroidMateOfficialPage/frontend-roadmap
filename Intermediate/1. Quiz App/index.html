<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Quiz App</title>

    <meta name="description" content="Interactive quiz app with score tracking and instant feedback">

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <main class="app">

        <!-- START SCREEN -->
        <section id="startScreen" class="screen active">

            <h1>Frontend Quiz Challenge</h1>

            <p>Test your knowledge. Instant feedback. No mercy.</p>

            <button id="startBtn">Start Quiz</button>

        </section>

        <!-- QUIZ SCREEN -->
        <section id="quizScreen" class="screen">

            <div class="top-bar">
                <p id="progress"></p>
                <p id="timer"></p>
            </div>

            <div class="card">

                <h2 id="question"></h2>

                <div id="answers" class="answers"></div>

            </div>

        </section>

        <!-- RESULT SCREEN -->
        <section id="resultScreen" class="screen">

            <h1>Quiz Completed</h1>

            <p id="scoreText"></p>

            <button onclick="location.reload()">Restart</button>

        </section>

    </main>

    <script src="script.js"></script>

</body>

</html>
