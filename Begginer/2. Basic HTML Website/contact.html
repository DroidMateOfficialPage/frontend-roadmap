<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Basic Meta Tags -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- SEO -->
    <title>Contact | Basic HTML Website</title>
    <meta name="description" content="Contact us through our HTML contact form.">
    <meta name="keywords" content="contact, form, website">
    <meta name="author" content="Iv">

    <!-- Favicon -->
    <link rel="icon" href="favicon.png" type="image/png">
</head>

<body>

    <!-- Header -->
    <header>
        <h1>Contact</h1>

        <!-- Navigation -->
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="projects.html">Projects</a></li>
                <li><a href="articles.html">Articles</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <!-- Main Content -->
    <main>

        <section>
            <h2>Send a Message</h2>

            <!-- Contact Form -->
            <form action="#" method="post">

                <div>
                    <label for="name">Name:</label><br>
                    <input
                        type="text"
                        id="name"
                        name="name"
                        required>
                </div>

                <br>

                <div>
                    <label for="email">Email:</label><br>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        required>
                </div>

                <br>

                <div>
                    <label for="subject">Subject:</label><br>
                    <input
                        type="text"
                        id="subject"
                        name="subject">
                </div>

                <br>

                <div>
                    <label for="message">Message:</label><br>
                    <textarea
                        id="message"
                        name="message"
                        rows="6"
                        cols="40"
                        required></textarea>
                </div>

                <br>

                <button type="submit">
                    Send Message
                </button>

            </form>
        </section>

        <aside>
            <h2>Contact Information</h2>

            <address>
                Email: hello@example.com <br>
                Phone: +387 00 000 000
            </address>
        </aside>

    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 Basic HTML Website</p>
    </footer>

</body>

</html>
