<!DOCTYPE html>
<html lang="en">

<head>

    <!-- META -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact Us Form</title>

    <meta name="description" content="Accessible semantic contact form built with HTML5 validation and proper structure">

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- HEADER -->
    <header>
        <h1>Contact Us</h1>
        <p>We usually respond within 24 hours.</p>
    </header>

    <!-- MAIN -->
    <main>

        <form action="/submit-form" method="post">

            <!-- FULL NAME -->
            <div class="field">
                <label for="fullName">Full Name</label>
                <input type="text" id="fullName" name="fullName" required>
            </div>

            <!-- EMAIL -->
            <div class="field">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" required>
            </div>

            <!-- SUBJECT -->
            <div class="field">
                <label for="subject">Subject</label>
                <select id="subject" name="subject" required>
                    <option value="">Select a topic</option>
                    <option value="support">Support</option>
                    <option value="business">Business Inquiry</option>
                    <option value="feedback">Feedback</option>
                </select>
            </div>

            <!-- MESSAGE -->
            <div class="field">
                <label for="message">Message</label>
                <textarea id="message" name="message" minlength="20" required></textarea>
            </div>

            <!-- RADIO GROUP -->
            <fieldset>
                <legend>How did you hear about us?</legend>

                <label>
                    <input type="radio" name="source" value="google" required>
                    Google
                </label>

                <label>
                    <input type="radio" name="source" value="social">
                    Social Media
                </label>

                <label>
                    <input type="radio" name="source" value="friend">
                    Friend
                </label>

            </fieldset>

            <!-- NEWSLETTER -->
            <div class="field checkbox">
                <label>
                    <input type="checkbox" name="newsletter">
                    Subscribe to our newsletter
                </label>
            </div>

            <!-- SUBMIT -->
            <button type="submit">Send Message</button>

        </form>

    </main>

    <!-- FOOTER -->
    <footer>
        <p>© 2026 Contact System</p>
    </footer>

    <script src="script.js"></script>

</body>

</html>
